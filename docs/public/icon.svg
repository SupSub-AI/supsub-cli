<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <style>
    /* 暖纸品牌标记：浅橘 / 橘 / 墨三层错位方块，跟随 LogoMark。
       深色标签栏下底层墨块改用纸色，复刻 LogoMark 的 inDark 行为，保持可读。 */
    .ink { fill: #16100c; }
    @media (prefers-color-scheme: dark) { .ink { fill: #faf5ed; } }
  </style>
  <rect x="11" y="4" width="14" height="7" rx="2.4" fill="#e09f84" />
  <rect x="4" y="12.5" width="15" height="7" rx="2.4" fill="#c2562b" />
  <rect class="ink" x="9" y="21" width="12" height="7" rx="2.4" />
</svg>
