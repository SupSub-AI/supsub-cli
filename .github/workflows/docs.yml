name: Deploy Docs

on:
  push:
    branches: [master]
    # 只有文档站相关文件变动才重新部署。
    # 刻意不列 package.json——chore(release) 每次只改它的 version 一行，
    # 列进来会让每次发版都白跑一遍文档部署。依赖变更（如升级 vitepress）
    # 由 pnpm-lock.yaml 兜住，它不记录本包自身的 version，不会被版本号误触发。
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署；不取消进行中的部署，避免线上站点处于半更新状态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # themeConfig.lastUpdated 依赖 git 历史取每个文件的最后提交时间，
          # 浅克隆会让所有页面显示同一时间
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v6

      - name: Build with VitePress
        run: pnpm docs:build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
